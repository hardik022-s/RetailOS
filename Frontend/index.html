<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetailOS · Retail Intelligence Framework</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Google Fonts: Inter & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["'Inter'", 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ["'Instrument Serif'", 'ui-serif', 'Georgia', 'serif'],
          },
          colors: {
            ink: '#14201b',
            muted: '#5d6a64',
            subtle: '#8a958f',
            line: '#e6ebe8',
            canvas: '#f6f8f7',
            brand: {
              DEFAULT: '#0e6b56',
              deep: '#0a4f40',
              soft: '#e5f3ee',
            },
            blush: {
              DEFAULT: '#fcf3f3',
              deep: '#f6e3e3',
            },
            amber: {
              DEFAULT: '#c99a3e',
              soft: '#f8f0dc',
            },
            danger: {
              DEFAULT: '#c0432f',
              soft: '#fbebe7',
            },
            night: '#0d1512',
            tint: {
              mint: '#eef7f3',
              'mint-edge': '#d8ece3',
              sand: '#fbf6ec',
              'sand-edge': '#f0e6d0',
              blush: '#fcf1f1',
              'blush-edge': '#f3dcdc',
              amber: '#fdf4e3',
              'amber-edge': '#f5e3bf',
              sky: '#eef4fb',
              'sky-edge': '#d9e5f3',
              lilac: '#f4f1fb',
              'lilac-edge': '#e2dcf2',
            },
          },
          animation: {
            'fade-up': 'fade-up 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both',
            'fade-in': 'fade-in 0.4s ease both',
            pop: 'pop 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both',
            scan: 'scan 2.4s ease-in-out infinite',
            float: 'float 6s ease-in-out infinite',
          },
          keyframes: {
            'fade-up': {
              from: { opacity: '0', transform: 'translateY(14px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
            'fade-in': {
              from: { opacity: '0' },
              to: { opacity: '1' },
            },
            pop: {
              from: { opacity: '0', transform: 'translateY(12px) scale(0.97)' },
              to: { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            scan: {
              '0%, 100%': { transform: 'translateY(-48px)' },
              '50%': { transform: 'translateY(48px)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' },
            },
          },
        },
      },
    };
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-white font-sans text-ink antialiased">
  <!-- Application Mount Containers -->
  <div id="app"></div>
  <div id="toast-root"></div>
  <div id="net-root"></div>
  <div id="modal-root"></div>
  <div id="login-root"></div>

  <!-- RetailOS Modular Scripts -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/import.js"></script>
  <script src="js/import-formats.js"></script>
  <script src="js/views.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
